- name: ping the server
  hosts: roboshop_frontend
  become: yes
  serial: 2
  tasks:
    - name: ping the server
      ping:

    - name: print Hi
      debug:
        msg: "HI"

    - name: install nginx
      dnf:
        name: nginx
        state: present

    - name: start nginx
      service:
        name: nginx
        state: restarted
        enabled: yes
